<!doctype html><meta charset="utf-8"><title>MoiLabs Übergabe</title>
<body style="font:16px system-ui;background:#0a0a0b;color:#ffd60a;padding:24px">MoiLabs Bild-Übergabe aktiv. Dieses Fenster nicht schließen.<pre id="log" style="color:#aaa"></pre>
<script>
const OK = 'https://business.facebook.com';
const log = t => document.getElementById('log').textContent += t + '\n';
window.addEventListener('message', async e => {
  if (e.origin !== OK || !e.data || e.data.type !== 'moi-get') return;
  try {
    const out = [];
    for (const p of e.data.paths) {
      const r = await fetch(p, {cache: 'no-store'});
      if (!r.ok) throw new Error(p + ' ' + r.status);
      out.push({name: p.split('/').slice(-2).join('_'), buf: await r.arrayBuffer()});
    }
    e.source.postMessage({type: 'moi-files', id: e.data.id, files: out}, OK, out.map(f => f.buf));
    log('gesendet: ' + e.data.paths.length + ' Bilder');
  } catch (err) { e.source.postMessage({type: 'moi-files', id: e.data.id, error: String(err)}, OK); log('Fehler ' + err); }
});
(window.opener || (window.parent !== window ? window.parent : null))?.postMessage({type: 'moi-ready'}, OK);
log('bereit');
</script>
