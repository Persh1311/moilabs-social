name: fetch-video-assets
on:
  push:
    branches: [video-assets]
    paths: [video/assets.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bilder der Steinmann-Demo laden
        run: |
          mkdir -p video/assets
          while read -r url; do [ -z "$url" ] && continue; f="video/assets/$(basename "$url")"; curl -fsSL --max-time 60 "$url" -o "$f"; done < video/assets.txt
          ls -la video/assets
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add video/assets && git commit -m "Video-Assets geladen" && git push || echo "nichts neu"
